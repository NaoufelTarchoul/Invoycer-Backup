    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-plus-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
      .font-playfair { font-family: 'Playfair Display', serif; }
      .font-jetbrains { font-family: 'JetBrains Mono', monospace; }
      .font-lato { font-family: 'Lato', sans-serif; }
      .font-roboto { font-family: 'Roboto', sans-serif; }
      .font-oswald { font-family: 'Oswald', sans-serif; }
      .font-poppins { font-family: 'Poppins', sans-serif; }
      .font-merriweather { font-family: 'Merriweather', serif; }
      .font-ptsans { font-family: 'PT Sans', sans-serif; }

      /* Custom print styles */
      @media print {
        @page { margin: 0; }
        body { background-color: white; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        .invoice-preview-container {
          box-shadow: none;
          margin: 0;
          width: 100%;
          max-width: 100%;
          border: none;
        }
      }

      /* Minimal selection color */
      ::selection {
        background-color: #171717;
        color: #ffffff;
      }
      .dark ::selection {
        background-color: #ffffff;
        color: #171717;
      }

      /* Autofill Styling Fixes */
      /* Force light mode autofill to look correct */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px white inset !important;
        -webkit-text-fill-color: #171717 !important;
        transition: background-color 5000s ease-in-out 0s;
      }
      
      /* Force dark mode autofill to look correct (dark bg, white text) */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover, 
      .dark input:-webkit-autofill:focus, 
      .dark input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px #171717 inset !important;
          -webkit-text-fill-color: white !important;
      }
    </style>
